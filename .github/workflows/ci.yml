name: NexTask CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nextask
          POSTGRES_USER: nextask
          POSTGRES_PASSWORD: nextask_local_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nextask -d nextask"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r backend/requirements.txt
      - name: Django checks and tests
        env:
          DJANGO_SECRET_KEY: ci-test-secret
          DJANGO_DEBUG: "1"
          POSTGRES_DB: nextask
          POSTGRES_USER: nextask
          POSTGRES_PASSWORD: nextask_local_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend
          python manage.py check
          python manage.py test
