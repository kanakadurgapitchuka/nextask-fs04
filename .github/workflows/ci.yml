name: NexTask CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nextask
          POSTGRES_USER: nextask
          POSTGRES_PASSWORD: nextask_local_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nextask -d nextask"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r backend/requirements.txt
      - name: Django checks and tests
        env:
          DJANGO_SECRET_KEY: ci-test-secret
          DJANGO_DEBUG: "1"
          POSTGRES_DB: nextask
          POSTGRES_USER: nextask
          POSTGRES_PASSWORD: nextask_local_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend
          python manage.py check
          python manage.py test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and build
        run: |
          cd frontend
          npm install
          npm run build

  docker-publish:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nextask-backend:latest
            ghcr.io/${{ github.repository_owner }}/nextask-backend:${{ github.sha }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nextask-frontend:latest
            ghcr.io/${{ github.repository_owner }}/nextask-frontend:${{ github.sha }}