services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nextask}
      POSTGRES_USER: ${POSTGRES_USER:-nextask}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nextask_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nextask} -d ${POSTGRES_DB:-nextask}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    env_file: .env
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  celery:
    build: ./backend
    env_file: .env
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on: [backend]
volumes:
  postgres_data:
  media_data:
